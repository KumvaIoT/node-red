<script type="text/javascript">
    RED.nodes.registerType('wait-response', {
        category: 'Kumva Insights',
        color: '#c6dbef',
        defaults: {
            name: { value: "Wait For Response" },
            timeout: { value: "30" },
            allowedResponses: { value: "1,2,3" },
            retries: { value: "2" },
            timeoutRoute: { value: "0" },
            invalidRoute: { value: "0" }
        },
        inputs: 1,
        outputs: 1,
        label: function() { return this.name || "Wait Response"; }
    });
</script>

<script type="text/html" data-template-name="wait-response">
    <div class="form-row">
        <label for="node-input-name">Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-timeout">Timeout (seconds)</label>
        <input type="number" id="node-input-timeout" min="5" max="120">
    </div>
    <div class="form-row">
        <label for="node-input-allowedResponses">Allowed Responses (comma separated)</label>
        <input type="text" id="node-input-allowedResponses" placeholder="1,2,3,0">
    </div>
    <div class="form-row">
        <label for="node-input-retries">Max Retries on Invalid</label>
        <input type="number" id="node-input-retries">
    </div>
</script>
