<script type="text/javascript">
    RED.nodes.registerType('end-call', {
        category: 'Kumva Insights',
        color: '#d62728',
        defaults: {
            name: { value: "End Call" },
            goodbyeTts: { value: "Thank you for completing the survey. Goodbye!" },
            goodbyeAudio: { value: "" },
            hangup: { value: true }
        },
        inputs: 1,
        outputs: 0,
        label: function() {
            return this.name || "End Call";
        }
    });
</script>

<script type="text/html" data-template-name="end-call">
    <div class="form-row">
        <label for="node-input-name">Name</label>
        <input type="text" id="node-input-name">

    <div class="form-row">
        <label for="node-input-goodbyeTts">Goodbye TTS Message</label>
        <textarea id="node-input-goodbyeTts" rows="3" style="width:70%"></textarea>
    </div>
    <div class="form-row">
        <label for="node-input-goodbyeAudio">Or Goodbye Audio URL</label>
        <input type="text" id="node-input-goodbyeAudio" placeholder="https://example.com/goodbye.mp3">
    </div>
</script>
