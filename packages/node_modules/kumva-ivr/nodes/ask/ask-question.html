<script type="text/javascript">
    RED.nodes.registerType('ask-question', {
        category: 'Kumva Insights',
        color: '#6baed6',
        defaults: {
            name: { value: "Ask Question" },
            ttsText: { value: "" },
            audioUrl: { value: "" },
            timeout: { value: "30" },
            allowedResponses: { value: "" },
            variableName: { value: "answer" }
        },
        inputs: 1,
        outputs: 1,
        label: function() { return this.name || "Ask Question"; }
    });
</script>

<script type="text/html" data-template-name="ask-question">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <div class="form-row">
        <label>TTS Text</label>
        <textarea id="node-input-ttsText" rows="4" style="width:70%"></textarea>
    </div>
    <div class="form-row">
        <label for="node-input-audioUrl">Audio URL</label>
        <input type="text" id="node-input-audioUrl" placeholder="https://...">
    </div>
    <div class="form-row">
        <label for="node-input-allowedResponses">Allowed Responses</label>
        <input type="text" id="node-input-allowedResponses" placeholder="1,2,3">
    </div>
    <div class="form-row">
        <label for="node-input-timeout">Timeout (sec)</label>
        <input type="number" id="node-input-timeout">
    </div>
</script>
