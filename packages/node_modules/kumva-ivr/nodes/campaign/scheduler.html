<script type="text/javascript">
    RED.nodes.registerType('kumva-scheduler', {
        category: 'Kumva Insights',
        color: '#ff7f0e',
        defaults: {
            name: { value: "Campaign Scheduler" },
            cron: { value: "0 9 * * *" },
            enabled: { value: true }
        },
        inputs: 0,
        outputs: 1,
        label: function() {
            return this.name || "Scheduler";
        }
    });
</script>

<script type="text/html" data-template-name="kumva-scheduler">
    <div class="form-row">
        <label for="node-input-name">Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-cron">Cron Expression</label>
        <input type="text" id="node-input-cron" placeholder="0 9 * * * (Daily at 9 AM)">
    </div>
    <div class="form-row">
        <input type="checkbox" id="node-input-enabled" style="margin-right: 5px;">
        <label for="node-input-enabled">Enabled</label>
    </div>
</script>
