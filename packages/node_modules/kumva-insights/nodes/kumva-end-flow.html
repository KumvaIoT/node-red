<script type="text/html" data-template-name="kumva-end-flow">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="End Flow">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Session Cleanup</label>
  </div>

  <div class="form-row">
    <label for="node-input-deleteSession"><i class="fa fa-trash"></i> Delete Session</label>
    <input type="checkbox" id="node-input-deleteSession" checked>
    <small>Remove session from Redis after flow completes</small>
  </div>

  <div class="form-row">
    <label for="node-input-storeReport"><i class="fa fa-file"></i> Store Session Report</label>
    <input type="checkbox" id="node-input-storeReport" checked>
    <small>Save session summary and metrics to disk storage</small>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Notifications & Webhooks</label>
  </div>

  <div class="form-row">
    <label for="node-input-sendNotification"><i class="icon-bell"></i> Send Notification</label>
    <input type="checkbox" id="node-input-sendNotification">
    <small>Notify external system when flow completes</small>
  </div>

  <div class="form-row" id="notification-url-row" style="display:none;">
    <label for="node-input-notificationUrl"><i class="icon-link"></i> Notification URL</label>
    <input type="text" id="node-input-notificationUrl" placeholder="https://example.com/webhook/flow-end">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Debug & Logging</label>
  </div>

  <div class="form-row">
    <label for="node-input-debugMode"><i class="fa fa-bug"></i> Debug Mode</label>
    <input type="checkbox" id="node-input-debugMode">
  </div>
</script>

<script type="text/html" data-help-name="kumva-end-flow">
  <p><strong>Kumva EndFlow Node</strong></p>
  <p>Closes campaign sessions, generates summaries, and cleans up resources.</p>
  
  <h3>Configuration</h3>
  <ul>
    <li><strong>Delete Session:</strong> Remove session from Redis after completing</li>
    <li><strong>Store Report:</strong> Save session summary to disk storage</li>
    <li><strong>Send Notification:</strong> POST session summary to external webhook</li>
  </ul>

  <h3>Inputs</h3>
  <p>Message should contain:</p>
  <ul>
    <li><code>msg.sessionId</code> - Session identifier (required)</li>
    <li><code>msg.campaignId</code> - Campaign identifier</li>
    <li><code>msg.finalMessage</code> - Optional final message to store</li>
    <li><code>msg.endReason</code> - Optional reason for ending (e.g., "completed", "user-requested")</li>
  </ul>

  <h3>Outputs</h3>
  <p>Outputs the final message with added data:</p>
  <ul>
    <li><code>msg.flowStatus</code> - 'ended'</li>
    <li><code>msg.sessionSummary</code> - Session summary object:
      <ul>
        <li>sessionId, phoneNumber, campaignId</li>
        <li>duration - Session duration in seconds</li>
        <li>responseCount - Number of responses collected</li>
        <li>startedAt, completedAt - Timestamps</li>
      </ul>
    </li>
  </ul>

  <h3>Session Summary Example</h3>
  <pre>{
  "sessionId": "session_xyz_123",
  "phoneNumber": "+250788123456",
  "campaignId": "campaign_abc",
  "duration": 240,
  "responseCount": 3,
  "status": "completed",
  "startedAt": "2024-01-15T10:30:00Z",
  "completedAt": "2024-01-15T10:34:00Z"
}</pre>

  <h3>HTTP Report Endpoint</h3>
  <p>After deployment, access campaign reports via:</p>
  <pre>GET /kumva/campaign/:campaignId/report</pre>
  <p>Example: <code>/kumva/campaign/campaign_abc/report</code></p>

  <h3>Notes</h3>
  <p>This node should be the last node in your flow. It automatically:</p>
  <ul>
    <li>Marks the session as completed</li>
    <li>Records final metrics and statistics</li>
    <li>Optionally deletes the session from Redis</li>
    <li>Generates a campaign report accessible via HTTP endpoint</li>
  </ul>
</script>

<script type="text/javascript">
  RED.nodes.registerType('kumva-end-flow', {
    category: 'Kumva Insights',
    color: '#FF5722',
    defaults: {
      name: { value: 'End Flow' },
      deleteSession: { value: true },
      storeReport: { value: true },
      sendNotification: { value: false },
      notificationUrl: { value: '' },
      debugMode: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-stop-circle',
    label: function() {
      return this.name || 'End Flow';
    },
    oneditprepare: function() {
      const sendNotifCheckbox = $('#node-input-sendNotification');

      function updateDisplay() {
        if (sendNotifCheckbox.is(':checked')) {
          $('#notification-url-row').show();
        } else {
          $('#notification-url-row').hide();
        }
      }

      sendNotifCheckbox.on('change', updateDisplay);
      updateDisplay();
    }
  });
</script>
