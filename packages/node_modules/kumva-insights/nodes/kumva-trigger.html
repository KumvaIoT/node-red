<script type="text/html" data-template-name="kumva-trigger">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Trigger">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-clock"></i> Schedule</label>
  </div>

  <div class="form-row">
    <label for="node-input-scheduleType"><i class="icon-calendar"></i> Schedule Type</label>
    <select id="node-input-scheduleType" style="width:70%;">
      <option value="none">Manual Only (trigger via input or button)</option>
      <option value="cron">Cron Expression</option>
      <option value="interval">Repeat Interval</option>
      <option value="once">Once (after delay)</option>
    </select>
  </div>

  <div class="form-row" id="cron-row" style="display:none;">
    <label for="node-input-cronExpression"><i class="icon-time"></i> Cron Expression</label>
    <input type="text" id="node-input-cronExpression" placeholder="0 9 * * * (daily at 9am)">
    <small>Examples: 0 9 * * * (daily 9am), 0 */2 * * * (every 2 hours), 0 0 * * 0 (weekly Sunday)</small>
  </div>

  <div class="form-row" id="interval-row" style="display:none;">
    <label for="node-input-intervalTime"><i class="icon-time"></i> Interval</label>
    <input type="text" id="node-input-intervalTime" placeholder="1h" value="1h">
    <small>Format: 30s, 5m, 2h, 1d</small>
  </div>

  <div class="form-row" id="once-row" style="display:none;">
    <label for="node-input-delayTime"><i class="icon-time"></i> Delay</label>
    <input type="text" id="node-input-delayTime" placeholder="5m" value="5m">
    <small>Format: 30s, 5m, 2h, 1d</small>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Contact Source</label>
  </div>

  <div class="form-row">
    <label for="node-input-contactSource"><i class="icon-list"></i> Source Type</label>
    <select id="node-input-contactSource" style="width:70%;">
      <option value="csv">CSV Data</option>
      <option value="json">JSON Data</option>
      <option value="manual">Manual Input</option>
    </select>
  </div>

  <div class="form-row" id="csv-row" style="display:none;">
    <label for="node-input-csvData"><i class="icon-file"></i> CSV Data</label>
    <textarea id="node-input-csvData" placeholder="phone,name,location" style="width:100%; height:120px;"></textarea>
  </div>

  <div class="form-row" id="json-row" style="display:none;">
    <label for="node-input-jsonData"><i class="icon-file"></i> JSON Data</label>
    <textarea id="node-input-jsonData" placeholder='[{"phone":"+250788123456","name":"John"}]' style="width:100%; height:120px;"></textarea>
  </div>

  <div class="form-row" id="manual-row" style="display:none;">
    <label for="node-input-manualContacts"><i class="icon-pencil"></i> Phone Numbers</label>
    <textarea id="node-input-manualContacts" placeholder="One per line" style="width:100%; height:120px;"></textarea>
  </div>

  <div class="form-row">
    <label for="node-input-phoneColumn"><i class="icon-phone"></i> Phone Column</label>
    <input type="text" id="node-input-phoneColumn" placeholder="phone" value="phone">
  </div>

  <div class="form-row">
    <label for="node-input-additionalFields"><i class="icon-tag"></i> Additional Fields</label>
    <input type="text" id="node-input-additionalFields" placeholder="name,location,email">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Campaign Settings</label>
  </div>

  <div class="form-row">
    <label for="node-input-initialMessage"><i class="icon-comment"></i> Initial Message</label>
    <textarea id="node-input-initialMessage" placeholder="Welcome!" style="width:100%; height:80px;"></textarea>
    <small>Supports: ${name}, ${phone}, ${location}, etc.</small>
  </div>

  <div class="form-row">
    <label for="node-input-rateLimit"><i class="icon-time"></i> Rate Limit (contacts/min)</label>
    <input type="number" id="node-input-rateLimit" placeholder="60" value="60" min="1">
  </div>
</script>

<script type="text/html" data-help-name="kumva-trigger">
  <p><strong>Kumva Trigger Node</strong></p>
  <p>Initiates campaigns with contacts from CSV/JSON/manual input. Schedule via cron, interval, or manual trigger.</p>
  
  <h3>Scheduling</h3>
  <ul>
    <li><strong>Manual Only:</strong> Trigger via input message or button click</li>
    <li><strong>Cron:</strong> Run on schedule (e.g., "0 9 * * *" = 9am daily)</li>
    <li><strong>Interval:</strong> Repeat every N time (e.g., "2h")</li>
    <li><strong>Once:</strong> Run after delay (e.g., "5m")</li>
  </ul>

  <h3>Trigger Methods</h3>
  <ul>
    <li>Schedule (if configured)</li>
    <li>Input message: <code>msg.payload = 'start'</code></li>
    <li>Manual button in editor</li>
  </ul>

  <h3>Outputs</h3>
  <p>For each contact:</p>
  <ul>
    <li><code>msg.phoneNumber</code> - Contact phone</li>
    <li><code>msg.contactData</code> - All contact fields</li>
    <li><code>msg.campaignId</code> - Campaign identifier</li>
  </ul>
</script>

<script type="text/javascript">
  RED.nodes.registerType('kumva-trigger', {
    category: 'Kumva Insights',
    color: '#4CAF50',
    defaults: {
      name: { value: 'Trigger' },
      scheduleType: { value: 'none' },
      cronExpression: { value: '0 9 * * *' },
      intervalTime: { value: '1h' },
      delayTime: { value: '5m' },
      contactSource: { value: 'csv' },
      csvData: { value: '' },
      jsonData: { value: '' },
      manualContacts: { value: '' },
      phoneColumn: { value: 'phone' },
      additionalFields: { value: '' },
      initialMessage: { value: '' },
      rateLimit: { value: 60, validate: RED.validators.number() }
    },
    inputs: 0,
    outputs: 1,
    icon: 'font-awesome/fa-play',
    label: function() {
      return this.name || 'Trigger';
    },
    oneditprepare: function() {
      const scheduleSelect = $('#node-input-scheduleType');
      const contactSelect = $('#node-input-contactSource');

      function updateScheduleDisplay() {
        const type = scheduleSelect.val();
        $('#cron-row, #interval-row, #once-row').hide();
        if (type === 'cron') $('#cron-row').show();
        else if (type === 'interval') $('#interval-row').show();
        else if (type === 'once') $('#once-row').show();
      }

      function updateContactDisplay() {
        const source = contactSelect.val();
        $('#csv-row, #json-row, #manual-row').hide();
        if (source === 'csv') $('#csv-row').show();
        else if (source === 'json') $('#json-row').show();
        else if (source === 'manual') $('#manual-row').show();
      }

      scheduleSelect.on('change', updateScheduleDisplay);
      contactSelect.on('change', updateContactDisplay);
      updateScheduleDisplay();
      updateContactDisplay();
    },
    button: {
      onclick: function() {
        const label = this._def.label.apply(this);
        fetch(`/kumva/trigger/${this.id}/start`, { method: 'POST' });
      }
    }
  });
</script>
