<script type="text/html" data-template-name="kumva-trigger">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Trigger">
  </div>

  <div class="form-row">
    <label><i class="icon-info"></i> Contact Source</label>
  </div>

  <div class="form-row">
    <label for="node-input-contactSource"><i class="icon-list"></i> Source Type</label>
    <select id="node-input-contactSource" style="width:70%;">
      <option value="csv">CSV File</option>
      <option value="json">JSON Data</option>
      <option value="manual">Manual Input</option>
      <option value="database">Database Query</option>
    </select>
  </div>

  <div class="form-row" id="csv-upload-row" style="display:none;">
    <label for="node-input-csvData"><i class="icon-file"></i> CSV Data</label>
    <textarea id="node-input-csvData" placeholder="phone,name,location&#10;+250788123456,John,Kigali&#10;+250788654321,Jane,Kampala" style="width:100%; height:150px;"></textarea>
    <small>First row should contain headers. Include 'phone' column.</small>
  </div>

  <div class="form-row" id="json-input-row" style="display:none;">
    <label for="node-input-jsonData"><i class="icon-file"></i> JSON Data</label>
    <textarea id="node-input-jsonData" placeholder='[{"phone":"+250788123456","name":"John"},{"phone":"+250788654321","name":"Jane"}]' style="width:100%; height:150px;"></textarea>
  </div>

  <div class="form-row" id="manual-input-row" style="display:none;">
    <label for="node-input-manualContacts"><i class="icon-pencil"></i> Phone Numbers</label>
    <textarea id="node-input-manualContacts" placeholder="One phone number per line&#10;+250788123456&#10;+250788654321" style="width:100%; height:150px;"></textarea>
  </div>

  <div class="form-row">
    <label><i class="icon-info"></i> Contact Mapping</label>
  </div>

  <div class="form-row">
    <label for="node-input-phoneColumn"><i class="icon-phone"></i> Phone Number Column</label>
    <input type="text" id="node-input-phoneColumn" placeholder="phone" value="phone">
  </div>

  <div class="form-row">
    <label for="node-input-additionalFields"><i class="icon-tag"></i> Additional Fields (comma-separated)</label>
    <input type="text" id="node-input-additionalFields" placeholder="name,location,email">
    <small>These will be available as variables in the flow (${name}, ${location}, etc.)</small>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Campaign Settings</label>
  </div>

  <div class="form-row">
    <label for="node-input-initialMessage"><i class="icon-comment"></i> Initial Message</label>
    <textarea id="node-input-initialMessage" placeholder="Welcome! Please reply with your choice." style="width:100%; height:80px;"></textarea>
    <small>You can use variables: ${name}, ${phone}, ${location}, etc.</small>
  </div>

  <div class="form-row">
    <label for="node-input-rateLimit"><i class="icon-time"></i> Rate Limit (contacts per minute)</label>
    <input type="number" id="node-input-rateLimit" placeholder="60" value="60" min="1">
  </div>

  <div class="form-row">
    <label for="node-input-retryFailed"><i class="fa fa-repeat"></i> Retry Failed Contacts</label>
    <input type="checkbox" id="node-input-retryFailed" checked>
  </div>

  <div class="form-row">
    <label for="node-input-maxRetries"><i class="icon-time"></i> Max Retries</label>
    <input type="number" id="node-input-maxRetries" placeholder="3" value="3" min="0">
  </div>
</script>

<script type="text/html" data-help-name="kumva-trigger">
  <p><strong>Kumva Trigger Node</strong></p>
  <p>Initiates a campaign by fetching contacts and triggering the flow for each contact.</p>
  
  <h3>Configuration</h3>
  <ul>
    <li><strong>Contact Source:</strong> Where to fetch contacts from (CSV, JSON, manual, or database)</li>
    <li><strong>Phone Number Column:</strong> The field name that contains phone numbers</li>
    <li><strong>Additional Fields:</strong> Other fields from your data that will be available as variables</li>
    <li><strong>Initial Message:</strong> Message to send when initiating the flow</li>
    <li><strong>Rate Limit:</strong> How many contacts to trigger per minute</li>
  </ul>

  <h3>Outputs</h3>
  <p>For each contact, outputs a message with:</p>
  <ul>
    <li><code>msg.phoneNumber</code> - Contact's phone number</li>
    <li><code>msg.contactData</code> - All contact fields as object</li>
    <li><code>msg.campaignId</code> - Campaign identifier</li>
    <li><code>msg.initialMessage</code> - Resolved initial message</li>
  </ul>

  <h3>Notes</h3>
  <p>Each contact is processed sequentially based on the rate limit. Variables defined in the contact data are available throughout the flow using ${variableName} syntax.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType('kumva-trigger', {
    category: 'Kumva Insights',
    color: '#4CAF50',
    defaults: {
      name: { value: 'Trigger' },
      contactSource: { value: 'csv' },
      csvData: { value: '' },
      jsonData: { value: '' },
      manualContacts: { value: '' },
      phoneColumn: { value: 'phone' },
      additionalFields: { value: '' },
      initialMessage: { value: '' },
      rateLimit: { value: 60, validate: RED.validators.number() },
      retryFailed: { value: true },
      maxRetries: { value: 3, validate: RED.validators.number() }
    },
    inputs: 0,
    outputs: 1,
    icon: 'font-awesome/fa-play',
    label: function() {
      return this.name || 'Trigger';
    },
    oneditprepare: function() {
      const contactSourceSelect = $('#node-input-contactSource');

      function updateSourceDisplay() {
        const source = contactSourceSelect.val();
        $('#csv-upload-row').hide();
        $('#json-input-row').hide();
        $('#manual-input-row').hide();

        switch(source) {
          case 'csv':
            $('#csv-upload-row').show();
            break;
          case 'json':
            $('#json-input-row').show();
            break;
          case 'manual':
            $('#manual-input-row').show();
            break;
        }
      }

      contactSourceSelect.on('change', updateSourceDisplay);
      updateSourceDisplay();
    }
  });
</script>
