<script type="text/html" data-template-name="kumva-start-campaign">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Start Campaign">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Webhook Configuration</label>
  </div>

  <div class="form-row">
    <label for="node-input-webhookPath"><i class="icon-link"></i> Webhook Path</label>
    <input type="text" id="node-input-webhookPath" placeholder="/kumva/webhook" value="/kumva/webhook">
    <small>Path to receive Africa's Talking callbacks</small>
  </div>

  <div class="form-row">
    <label><i class="icon-info"></i> Full Webhook URL</label>
    <div style="padding:8px; background:#f5f5f5; border-radius:3px; word-break:break-all;">
      <code id="webhook-url-display">https://domain-name.com/kumva/webhook</code>
    </div>
    <small>Full URL for Africa's Talking. Set KUMVA_WEBHOOK_BASE_URL in .env</small>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Campaign Configuration</label>
  </div>

  <div class="form-row">
    <label for="node-input-campaignType"><i class="icon-phone"></i> Campaign Type</label>
    <select id="node-input-campaignType" style="width:70%;">
      <option value="sms">SMS Campaign</option>
      <option value="voice">Voice Call Campaign</option>
      <option value="2way-sms">Two-Way SMS</option>
    </select>
  </div>

  <div class="form-row">
    <label for="node-input-shortCode"><i class="icon-keyboard"></i> Short Code / Caller ID</label>
    <input type="text" id="node-input-shortCode" placeholder="e.g., 21234 or +250788000000">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Session Management</label>
  </div>

  <div class="form-row">
    <label for="node-input-sessionTimeout"><i class="icon-time"></i> Session Timeout</label>
    <input type="text" id="node-input-sessionTimeout" placeholder="3600s" value="3600s">
    <small>Format: 30s, 5m, 2h, 1d</small>
  </div>

  <div class="form-row">
    <label for="node-input-storeResponses"><i class="fa fa-hdd-o"></i> Store Responses</label>
    <input type="checkbox" id="node-input-storeResponses" checked>
  </div>

  <div class="form-row">
    <label for="node-input-debugMode"><i class="fa fa-bug"></i> Debug Mode</label>
    <input type="checkbox" id="node-input-debugMode">
  </div>
</script>

<script type="text/html" data-help-name="kumva-start-campaign">
  <p><strong>Kumva StartCampaign Node</strong></p>
  <p>Initializes campaign sessions, registers webhook for Africa's Talking callbacks.</p>
  
  <h3>Configuration</h3>
  <ul>
    <li><strong>Webhook Path:</strong> Where to receive Africa's Talking callbacks (e.g., /kumva/webhook)</li>
    <li><strong>Campaign Type:</strong> SMS, Voice, or Two-Way SMS</li>
    <li><strong>Session Timeout:</strong> How long to keep session alive</li>
  </ul>

  <h3>Inputs</h3>
  <ul>
    <li><code>msg.phoneNumber</code> - Recipient phone number</li>
    <li><code>msg.campaignId</code> - Campaign identifier</li>
    <li><code>msg.initialMessage</code> - First message to send</li>
    <li><code>msg.contactData</code> - Contact info object</li>
  </ul>

  <h3>Outputs</h3>
  <ul>
    <li><code>msg.sessionId</code> - Unique session identifier</li>
    <li><code>msg.webhookUrl</code> - Full webhook URL for Africa's Talking</li>
  </ul>

  <h3>Setup</h3>
  <ol>
    <li>Set KUMVA_WEBHOOK_BASE_URL in .env</li>
    <li>Get webhook URL from msg.webhookUrl</li>
    <li>Add to Africa's Talking dashboard callbacks</li>
  </ol>
</script>

<script type="text/javascript">
  RED.nodes.registerType('kumva-start-campaign', {
    category: 'Kumva Insights',
    color: '#2196F3',
    defaults: {
      name: { value: 'Start Campaign' },
      webhookPath: { value: '/kumva/webhook' },
      campaignType: { value: 'sms' },
      shortCode: { value: '' },
      sessionTimeout: { value: '3600s' },
      storeResponses: { value: true },
      debugMode: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-play-circle',
    label: function() {
      return this.name || 'Start Campaign';
    },
    oneditprepare: function() {
      const baseUrl = process.env.KUMVA_WEBHOOK_BASE_URL || 'http://localhost:1880';
      const pathInput = $('#node-input-webhookPath');
      const urlDisplay = $('#webhook-url-display');

      function updateUrlDisplay() {
        const path = pathInput.val();
        const cleanBase = baseUrl.replace(/\/$/, '');
        const fullUrl = cleanBase + path;
        urlDisplay.text(fullUrl);
      }

      pathInput.on('change keyup', updateUrlDisplay);
      updateUrlDisplay();
    }
  });
</script>
