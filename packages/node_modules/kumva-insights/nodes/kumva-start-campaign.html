<script type="text/html" data-template-name="kumva-start-campaign">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Start Campaign">
  </div>

  <hr>

  <div class="form-row">
    <label for="node-input-initiationMode"><i class="icon-exchange"></i> Mode</label>
    <select id="node-input-initiationMode" style="width:70%;">
      <option value="outbound">Outbound (We initiate SMS/Call)</option>
      <option value="inbound">Inbound (User calls/texts us)</option>
    </select>
    <small>Outbound: We send message/call, get sessionId. Inbound: User contacts, sessionId from webhook.</small>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-cog"></i> Africa's Talking</label>
    <button id="toggleConfig" type="button" class="red-ui-button" style="float:right; margin-top:-5px;">
      <i class="fa fa-chevron-right"></i> Show
    </button>
  </div>

  <div id="configPanel" style="display:none; background:#fffbf0; border:1px solid #FF9800; border-radius:4px; padding:15px; margin:10px 0;">
    
    <div class="form-row">
      <label for="node-input-username"><i class="icon-user"></i> Username <span style="color:red;">*</span></label>
      <input type="text" id="node-input-username" placeholder="Africa's Talking username">
    </div>

    <div class="form-row">
      <label for="node-input-apiKey"><i class="icon-key"></i> API Key <span style="color:red;">*</span></label>
      <input type="password" id="node-input-apiKey" placeholder="Africa's Talking API key">
      <small>Stored securely</small>
    </div>

    <div class="form-row">
      <label for="node-input-campaignType"><i class="icon-phone"></i> Service Type</label>
      <select id="node-input-campaignType" style="width:70%;">
        <option value="sms">SMS</option>
        <option value="voice">Voice (IVR)</option>
      </select>
    </div>

    <div class="form-row" id="shortcodeRow">
      <label for="node-input-shortCode"><i class="icon-keyboard"></i> Short Code (SMS)</label>
      <input type="text" id="node-input-shortCode" placeholder="e.g., 21234">
      <small>Sender ID (optional)</small>
    </div>

    <div class="form-row" id="calleridRow" style="display:none;">
      <label for="node-input-callerId"><i class="icon-phone"></i> Caller ID (Voice)</label>
      <input type="text" id="node-input-callerId" placeholder="e.g., +250788000000">
      <small>For IVR calls (optional)</small>
    </div>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-link"></i> Webhook Configuration</label>
  </div>

  <div class="form-row">
    <label for="node-input-webhookPath"><i class="icon-link"></i> Webhook Path</label>
    <input type="text" id="node-input-webhookPath" placeholder="/kumva/webhook" value="/kumva/webhook">
    <small>Unique path per flow</small>
    <div id="webhookStatus" style="margin-top:5px; font-size:12px;"></div>
  </div>

  <div class="form-row">
    <label><i class="icon-info"></i> Full Webhook URL</label>
    <div style="padding:8px; background:#f5f5f5; border-radius:3px; word-break:break-all; border:1px solid #ddd; font-family:monospace; font-size:12px;">
      <code id="webhookUrlDisplay">https://your-domain.com/kumva/webhook</code>
    </div>
    <small>Copy this to Africa's Talking dashboard → Webhooks</small>
  </div>

  <hr>

  <div class="form-row">
    <label for="node-input-sessionTimeout"><i class="icon-time"></i> Session Timeout</label>
    <input type="text" id="node-input-sessionTimeout" placeholder="3600s" value="3600s">
    <small>Format: 30s, 5m, 2h, 1d</small>
  </div>

  <div class="form-row">
    <label for="node-input-storeResponses"><i class="fa fa-hdd-o"></i> Store Responses</label>
    <input type="checkbox" id="node-input-storeResponses" checked>
  </div>

  <div class="form-row">
    <label for="node-input-debugMode"><i class="fa fa-bug"></i> Debug Mode</label>
    <input type="checkbox" id="node-input-debugMode">
  </div>
</script>

<script type="text/html" data-help-name="kumva-start-campaign">
  <p><strong>Start Campaign Node</strong></p>
  <p>Sets up campaign context. Does NOT create sessionId (comes from Africa's Talking).</p>
  
  <h3>Modes</h3>
  <ul>
    <li><strong>Outbound:</strong> We send SMS/call → Africa's Talking returns sessionId</li>
    <li><strong>Inbound:</strong> User contacts us → sessionId in webhook callback</li>
  </ul>

  <h3>Flow</h3>
  <pre>
  Outbound SMS:
  Trigger → Start Campaign → Send Message (sends SMS, gets messageId)
                                 ↓
                         User replies → Webhook (has sessionId)
                                 ↓
                         Wait for Response

  Outbound Voice:
  Trigger → Start Campaign → Send Message (makes call, gets sessionId immediately)
                                 ↓
                         Wait for Response (has sessionId)

  Inbound:
  Trigger → Start Campaign → (wait for user to contact)
                                 ↓
                         User calls/texts → Webhook (has sessionId)
                                 ↓
                         Wait for Response
  </pre>
</script>

<script type="text/javascript">
  RED.nodes.registerType('kumva-start-campaign', {
    category: 'Kumva Insights',
    color: '#2196F3',
    defaults: {
      name: { value: 'Start Campaign' },
      initiationMode: { value: 'outbound' },
      campaignType: { value: 'sms' },
      webhookPath: { value: '/kumva/webhook' },
      shortCode: { value: '' },
      callerId: { value: '' },
      sessionTimeout: { value: '3600s' },
      storeResponses: { value: true },
      debugMode: { value: false }
    },
    credentials: {
      username: { type: 'text' },
      apiKey: { type: 'password' }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-play-circle',
    label: function() {
      return this.name || 'Start Campaign';
    },
    oneditprepare: function() {
      const baseUrl = window.location.host;

      // Load values
      $('#node-input-username').val(this.credentials?.username || '');
      $('#node-input-initiationMode').val(this.initiationMode || 'outbound');
      $('#node-input-campaignType').val(this.campaignType || 'sms');
      $('#node-input-shortCode').val(this.shortCode || '');
      $('#node-input-callerId').val(this.callerId || '');
      $('#node-input-webhookPath').val(this.webhookPath || '/kumva/webhook');
      $('#node-input-sessionTimeout').val(this.sessionTimeout || '3600s');
      $('#node-input-storeResponses').prop('checked', this.storeResponses !== false);
      $('#node-input-debugMode').prop('checked', this.debugMode || false);

      // Toggle config panel
      $('#toggleConfig').on('click', function(e) {
        e.preventDefault();
        const panel = $('#configPanel');
        if (panel.is(':visible')) {
          panel.slideUp(200);
          $(this).html('<i class="fa fa-chevron-right"></i> Show');
        } else {
          panel.slideDown(200);
          $(this).html('<i class="fa fa-chevron-down"></i> Hide');
        }
      });

      // Service type toggle
      $('#node-input-campaignType').on('change', function() {
        const isSMS = $(this).val() === 'sms';
        $('#shortcodeRow').toggle(isSMS);
        $('#calleridRow').toggle(!isSMS);
      }).trigger('change');

      // Webhook URL display
      function updateWebhookDisplay() {
        const path = $('#node-input-webhookPath').val() || '/kumva/webhook';
        const fullUrl = baseUrl + path;
        $('#webhookUrlDisplay').text(fullUrl);
      }

      $('#node-input-webhookPath').on('change keyup', updateWebhookDisplay);
      updateWebhookDisplay();
    },
    onsave: function() {
      this.initiationMode = $('#node-input-initiationMode').val();
      this.campaignType = $('#node-input-campaignType').val();
      this.shortCode = $('#node-input-shortCode').val();
      this.callerId = $('#node-input-callerId').val();
    }
  });
</script>
