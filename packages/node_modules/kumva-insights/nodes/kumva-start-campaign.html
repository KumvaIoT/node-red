<script type="text/html" data-template-name="kumva-start-campaign">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Start Campaign">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Campaign Configuration</label>
  </div>

  <div class="form-row">
    <label for="node-input-campaignType"><i class="icon-phone"></i> Campaign Type</label>
    <select id="node-input-campaignType" style="width:70%;">
      <option value="sms">SMS Campaign</option>
      <option value="voice">Voice Call Campaign</option>
      <option value="2way-sms">Two-Way SMS (Dialer)</option>
    </select>
  </div>

  <div class="form-row">
    <label for="node-input-shortCode"><i class="icon-keyboard"></i> Short Code / Caller ID</label>
    <input type="text" id="node-input-shortCode" placeholder="e.g., 21234 or +250788000000">
    <small>Sender ID for SMS or Caller ID for voice calls. Leave empty to use default.</small>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Webhook Settings</label>
  </div>

  <div class="form-row">
    <label for="node-input-webhookUrl"><i class="icon-link"></i> Webhook URL</label>
    <input type="text" id="node-input-webhookUrl" placeholder="https://your-server.com/webhook/kumva" readonly>
    <small>Auto-generated. Make sure this is accessible from Africa's Talking servers.</small>
  </div>

  <div class="form-row">
    <label for="node-input-useWebhook"><i class="fa fa-check-square"></i> Enable Webhook Callbacks</label>
    <input type="checkbox" id="node-input-useWebhook" checked>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Session Management</label>
  </div>

  <div class="form-row">
    <label for="node-input-sessionTimeout"><i class="icon-time"></i> Session Timeout</label>
    <input type="text" id="node-input-sessionTimeout" placeholder="3600s" value="3600s">
    <small>Format: 30s, 5m, 2h, 1d</small>
  </div>

  <div class="form-row">
    <label for="node-input-storeResponses"><i class="fa fa-hdd-o"></i> Store Responses</label>
    <input type="checkbox" id="node-input-storeResponses" checked>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Debug & Logging</label>
  </div>

  <div class="form-row">
    <label for="node-input-debugMode"><i class="fa fa-bug"></i> Debug Mode</label>
    <input type="checkbox" id="node-input-debugMode">
  </div>
</script>

<script type="text/html" data-help-name="kumva-start-campaign">
  <p><strong>Kumva StartCampaign Node</strong></p>
  <p>Initializes a campaign session, sets up webhook callbacks, and manages session lifecycle.</p>
  
  <h3>Configuration</h3>
  <ul>
    <li><strong>Campaign Type:</strong> SMS (text), Voice (IVR), or Two-Way SMS</li>
    <li><strong>Short Code/Caller ID:</strong> Sender identifier for messages or calls</li>
    <li><strong>Session Timeout:</strong> How long to keep session active waiting for responses</li>
    <li><strong>Store Responses:</strong> Whether to persist user responses to disk</li>
  </ul>

  <h3>Inputs</h3>
  <p>Message should contain:</p>
  <ul>
    <li><code>msg.phoneNumber</code> - Recipient's phone number</li>
    <li><code>msg.initialMessage</code> - First message to send</li>
    <li><code>msg.campaignId</code> - Campaign identifier</li>
    <li>Additional contact fields from Trigger node</li>
  </ul>

  <h3>Outputs</h3>
  <p>On successful initialization:</p>
  <ul>
    <li><code>msg.sessionId</code> - Unique session identifier</li>
    <li><code>msg.campaignStatus</code> - 'initialized'</li>
    <li>All input fields passed through</li>
  </ul>

  <h3>Notes</h3>
  <p>This node must be first in the flow after the Trigger node. It sets up all necessary session management and webhook infrastructure. The webhook URL is automatically generated based on your Node-RED instance configuration.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType('kumva-start-campaign', {
    category: 'Kumva Insights',
    color: '#2196F3',
    defaults: {
      name: { value: 'Start Campaign' },
      campaignType: { value: 'sms' },
      shortCode: { value: '' },
      webhookUrl: { value: '' },
      useWebhook: { value: true },
      sessionTimeout: { value: '3600s' },
      storeResponses: { value: true },
      debugMode: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-play-circle',
    label: function() {
      return this.name || 'Start Campaign';
    }
  });
</script>
