<script type="text/html" data-template-name="kumva-start-campaign">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Start Campaign">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-cog"></i> Africa's Talking</label>
    <button id="toggleConfig" type="button" class="red-ui-button" style="float:right; margin-top:-5px;">
      <i class="fa fa-chevron-right"></i> Show
    </button>
  </div>

  <div id="configPanel" style="display:none; background:#fffbf0; border:1px solid #FF9800; border-radius:4px; padding:15px; margin:10px 0;">
    
    <div class="form-row">
      <label for="node-input-username"><i class="icon-user"></i> Username <span style="color:red;">*</span></label>
      <input type="text" id="node-input-username" placeholder="Africa's Talking username">
    </div>

    <div class="form-row">
      <label for="node-input-apiKey"><i class="icon-key"></i> API Key <span style="color:red;">*</span></label>
      <input type="password" id="node-input-apiKey" placeholder="Enter new API key to change">
      <div id="apiKeyMasked" style="margin-top:6px; font-size:13px; font-family:monospace; color:#0066cc;"></div>
    </div>

    <div class="form-row">
      <label for="node-input-serviceType"><i class="icon-phone"></i> Service Type</label>
      <select id="node-input-serviceType" style="width:70%;">
        <option value="sms">SMS</option>
        <option value="voice">Voice (IVR)</option>
        <option value="2way-sms">Two-Way SMS</option>
      </select>
    </div>

    <div class="form-row" id="shortcodeRow">
      <label for="node-input-shortCode"><i class="icon-keyboard"></i> Short Code</label>
      <input type="text" id="node-input-shortCode" placeholder="e.g., 21234">
      <small>Sender ID for SMS (optional)</small>
    </div>

    <div class="form-row" id="calleridRow" style="display:none;">
      <label for="node-input-callerId"><i class="icon-phone"></i> Caller ID</label>
      <input type="text" id="node-input-callerId" placeholder="e.g., +250788000000">
      <small>For voice calls (optional)</small>
    </div>

    <div class="form-row">
      <small style="color:#666;">
        <strong>Setup:</strong> Copy webhook URL below to Africa's Talking → Settings → Webhooks
      </small>
    </div>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-link"></i> Webhook</label>
  </div>

  <div class="form-row">
    <label for="node-input-webhookPath"><i class="icon-link"></i> Path</label>
    <input type="text" id="node-input-webhookPath" placeholder="/kumva/webhook" value="/kumva/webhook">
    <small>Unique path per flow</small>
    <div id="webhookStatus" style="margin-top:5px; font-size:12px;"></div>
  </div>

  <div class="form-row">
    <label><i class="icon-info"></i> Full URL</label>
    <div style="padding:8px; background:#f5f5f5; border-radius:3px; word-break:break-all; border:1px solid #ddd;">
      <code id="webhookUrlDisplay">https://your-domain.com/kumva/webhook</code>
    </div>
  </div>

  <hr>

  <div class="form-row">
    <label for="node-input-sessionTimeout"><i class="icon-time"></i> Session Timeout</label>
    <input type="text" id="node-input-sessionTimeout" placeholder="3600s" value="3600s">
    <small>Format: 30s, 5m, 2h, 1d</small>
  </div>

  <div class="form-row">
    <label for="node-input-storeResponses"><i class="fa fa-hdd-o"></i> Store Responses</label>
    <input type="checkbox" id="node-input-storeResponses" checked>
  </div>

  <div class="form-row">
    <label for="node-input-debugMode"><i class="fa fa-bug"></i> Debug Mode</label>
    <input type="checkbox" id="node-input-debugMode">
  </div>
</script>

<script type="text/html" data-help-name="kumva-start-campaign">
  <p><strong>Start Campaign Node</strong></p>
  <p>Initializes campaign with embedded Africa's Talking credentials.</p>
  
  <h3>Setup</h3>
  <ol>
    <li>Click "Show" button to expand Africa's Talking config</li>
    <li>Enter your Africa's Talking username and API key</li>
    <li>Select service type (SMS or Voice)</li>
    <li>Copy webhook URL to Africa's Talking dashboard</li>
    <li>Deploy</li>
  </ol>
</script>

<script type="text/javascript">
  RED.nodes.registerType('kumva-start-campaign', {
    category: 'Kumva Insights',
    color: '#2196F3',
    defaults: {
      name: { value: 'Start Campaign' },
      webhookPath: { value: '/kumva/webhook' },
      campaignType: { value: 'sms' },
      shortCode: { value: '' },
      callerId: { value: '' },
      sessionTimeout: { value: '3600s' },
      storeResponses: { value: true },
      debugMode: { value: false },
      apiKeyPreview: { value: '' }        // ← New field for preview

    },
    credentials: {
      username: { type: 'text' },
      apiKey: { type: 'password' }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-play-circle',
    label: function() {
      return this.name || 'Start Campaign';
    },

    oneditprepare: function() {
      const baseUrl = window.location.host || 'localhost:1880';

      // Username
      $('#node-input-username').val(this.credentials?.username || '');

      // API Key Masking
      const maskedEl = $('#apiKeyMasked');
      if (this.apiKeyPreview) {
        maskedEl.html(`<strong>Current Key:</strong> <span style="color:#0066cc;">${this.apiKeyPreview}</span>`);
      } else if (this.credentials?.has_apiKey) {
        maskedEl.text('API Key is set (preview unavailable)');
      } else {
        maskedEl.text('No API Key set');
      }

      // Other fields
      $('#node-input-serviceType').val(this.campaignType || 'sms');
      $('#node-input-shortCode').val(this.shortCode || '');
      $('#node-input-callerId').val(this.callerId || '');
      $('#node-input-webhookPath').val(this.webhookPath || '/kumva/webhook');
      $('#node-input-sessionTimeout').val(this.sessionTimeout || '3600s');
      $('#node-input-storeResponses').prop('checked', this.storeResponses !== false);
      $('#node-input-debugMode').prop('checked', this.debugMode || false);

      // Toggle Config Panel
      $('#toggleConfig').on('click', function(e) {
        e.preventDefault();
        const panel = $('#configPanel');
        const btn = $(this);
        if (panel.is(':visible')) {
          panel.slideUp(200);
          btn.html('<i class="fa fa-chevron-right"></i> Show');
        } else {
          panel.slideDown(200);
          btn.html('<i class="fa fa-chevron-down"></i> Hide');
        }
      });

      // Service Type Toggle
      $('#node-input-serviceType').on('change', function() {
        const type = $(this).val();
        $('#shortcodeRow').toggle(type !== 'voice');
        $('#calleridRow').toggle(type === 'voice');
      }).trigger('change');

      // Webhook Display
      function updateWebhookDisplay() {
        const path = $('#node-input-webhookPath').val() || '/kumva/webhook';
        const fullUrl = baseUrl.replace(/\/$/, '') + path;
        $('#webhookUrlDisplay').text(fullUrl);
      }

      $('#node-input-webhookPath').on('change keyup', updateWebhookDisplay);
      updateWebhookDisplay();
    },

    oneditsave: function() {
      this.name = $('#node-input-name').val();
      this.webhookPath = $('#node-input-webhookPath').val();
      this.campaignType = $('#node-input-serviceType').val();
      this.shortCode = $('#node-input-shortCode').val();
      this.callerId = $('#node-input-callerId').val();
      this.sessionTimeout = $('#node-input-sessionTimeout').val();
      this.storeResponses = $('#node-input-storeResponses').is(':checked');
      this.debugMode = $('#node-input-debugMode').is(':checked');

      const newKey = $('#node-input-apiKey').val().trim();
      if (newKey.length > 6) {
        const preview = newKey.substring(0, 8) + '••••••••••••••••••••••••••' + newKey.substring(newKey.length - 3);
        this.apiKeyPreview = preview;
      }
    }
  });
</script>
