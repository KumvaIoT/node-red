<script type="text/html" data-template-name="kumva-send-message">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Send Message">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Message Configuration</label>
  </div>

  <div class="form-row">
    <label for="node-input-messageType"><i class="icon-comment"></i> Message Type</label>
    <select id="node-input-messageType" style="width:70%;">
      <option value="sms">SMS (Text Message)</option>
      <option value="ivr-audio">IVR (Audio URL)</option>
      <option value="ivr-tts">IVR (Text-to-Speech)</option>
    </select>
  </div>

  <div class="form-row" id="sms-content-row">
    <label for="node-input-messageContent"><i class="icon-comment"></i> Message Text</label>
    <textarea id="node-input-messageContent" placeholder="Hello ${name}, please reply with your choice." style="width:100%; height:100px;"></textarea>
    <small>Supports variables: ${name}, ${phone}, ${location}, etc.</small>
  </div>

  <div class="form-row" id="ivr-audio-row" style="display:none;">
    <label for="node-input-audioUrl"><i class="icon-music"></i> Audio URL</label>
    <input type="text" id="node-input-audioUrl" placeholder="https://example.com/audio.mp3">
    <small>URL to audio file (WAV, MP3, etc.)</small>
  </div>

  <div class="form-row" id="ivr-tts-row" style="display:none;">
    <label for="node-input-ttsText"><i class="icon-microphone"></i> Text for TTS</label>
    <textarea id="node-input-ttsText" placeholder="Welcome to our service..." style="width:100%; height:100px;"></textarea>
    <small>Supports variables: ${name}, ${phone}, ${location}, etc.</small>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Recipient Configuration</label>
  </div>

  <div class="form-row">
    <label for="node-input-phoneSource"><i class="icon-phone"></i> Phone Number Source</label>
    <select id="node-input-phoneSource" style="width:70%;">
      <option value="msg">From msg.phoneNumber (automatic)</option>
      <option value="static">Static phone number</option>
      <option value="variable">From message variable</option>
    </select>
  </div>

  <div class="form-row" id="static-phone-row" style="display:none;">
    <label for="node-input-staticPhone"><i class="icon-phone"></i> Phone Number</label>
    <input type="text" id="node-input-staticPhone" placeholder="+250788123456">
  </div>

  <div class="form-row" id="variable-phone-row" style="display:none;">
    <label for="node-input-variablePhone"><i class="icon-code"></i> Variable Name</label>
    <input type="text" id="node-input-variablePhone" placeholder="phoneNumber (will use msg.phoneNumber)">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Retry & Error Handling</label>
  </div>

  <div class="form-row">
    <label for="node-input-retryOnFailure"><i class="fa fa-repeat"></i> Retry on Failure</label>
    <input type="checkbox" id="node-input-retryOnFailure" checked>
  </div>

  <div class="form-row" id="retry-config-row">
    <label for="node-input-maxRetries"><i class="icon-time"></i> Max Retries</label>
    <input type="number" id="node-input-maxRetries" placeholder="3" value="3" min="0">
  </div>

  <div class="form-row">
    <label for="node-input-debugMode"><i class="fa fa-bug"></i> Debug Mode</label>
    <input type="checkbox" id="node-input-debugMode">
  </div>
</script>

<script type="text/html" data-help-name="kumva-send-message">
  <p><strong>Kumva SendMessage Node</strong></p>
  <p>Sends SMS or IVR messages to contacts using Africa's Talking SDK.</p>
  
  <h3>Configuration</h3>
  <ul>
    <li><strong>Message Type:</strong> SMS (text), IVR with audio URL, or IVR with text-to-speech</li>
    <li><strong>Message Content:</strong> The actual message, supports variable interpolation</li>
    <li><strong>Phone Number Source:</strong> Where to get the recipient's number</li>
    <li><strong>Retry Settings:</strong> Automatic retry on failure</li>
  </ul>

  <h3>Inputs</h3>
  <p>Message should contain (from Trigger/StartCampaign):</p>
  <ul>
    <li><code>msg.phoneNumber</code> - Recipient's phone number (if using automatic source)</li>
    <li><code>msg.initialMessage</code> or custom message content</li>
    <li>Contact variables (name, location, etc.)</li>
  </ul>

  <h3>Outputs</h3>
  <p>On successful send:</p>
  <ul>
    <li><code>msg.messageId</code> - Africa's Talking message ID</li>
    <li><code>msg.sendStatus</code> - 'success' or 'failed'</li>
    <li><code>msg.sendResult</code> - Full response from API</li>
  </ul>

  <h3>Variables</h3>
  <p>Use ${variable_name} syntax for dynamic content:</p>
  <ul>
    <li>${name} - Contact name</li>
    <li>${phone} - Contact phone number</li>
    <li>${location} - Contact location</li>
    <li>Any other field from contact data</li>
  </ul>

  <h3>Notes</h3>
  <p>Make sure Africa's Talking credentials are configured in global settings. Phone numbers should be in E.164 format or will be auto-formatted.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType('kumva-send-message', {
    category: 'Kumva Insights',
    color: '#FF9800',
    defaults: {
      name: { value: 'Send Message' },
      messageType: { value: 'sms' },
      messageContent: { value: '' },
      audioUrl: { value: '' },
      ttsText: { value: '' },
      phoneSource: { value: 'msg' },
      staticPhone: { value: '' },
      variablePhone: { value: 'phoneNumber' },
      retryOnFailure: { value: true },
      maxRetries: { value: 3, validate: RED.validators.number() },
      debugMode: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-paper-plane',
    label: function() {
      return this.name || 'Send Message';
    },
    oneditprepare: function() {
      const messageTypeSelect = $('#node-input-messageType');
      const phoneSourceSelect = $('#node-input-phoneSource');
      const retryCheckbox = $('#node-input-retryOnFailure');

      function updateMessageTypeDisplay() {
        const type = messageTypeSelect.val();
        $('#sms-content-row').hide();
        $('#ivr-audio-row').hide();
        $('#ivr-tts-row').hide();

        switch(type) {
          case 'sms':
            $('#sms-content-row').show();
            break;
          case 'ivr-audio':
            $('#ivr-audio-row').show();
            break;
          case 'ivr-tts':
            $('#ivr-tts-row').show();
            break;
        }
      }

      function updatePhoneSourceDisplay() {
        const source = phoneSourceSelect.val();
        $('#static-phone-row').hide();
        $('#variable-phone-row').hide();

        switch(source) {
          case 'static':
            $('#static-phone-row').show();
            break;
          case 'variable':
            $('#variable-phone-row').show();
            break;
        }
      }

      function updateRetryDisplay() {
        if (retryCheckbox.is(':checked')) {
          $('#retry-config-row').show();
        } else {
          $('#retry-config-row').hide();
        }
      }

      messageTypeSelect.on('change', updateMessageTypeDisplay);
      phoneSourceSelect.on('change', updatePhoneSourceDisplay);
      retryCheckbox.on('change', updateRetryDisplay);

      updateMessageTypeDisplay();
      updatePhoneSourceDisplay();
      updateRetryDisplay();
    }
  });
</script>
