<script type="text/html" data-template-name="kumva-webhook-config">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Webhook Config">
  </div>

  <hr>

  <div class="form-row">
    <label for="node-input-webhookPath"><i class="icon-link"></i> Webhook Path</label>
    <input type="text" id="node-input-webhookPath" placeholder="/kumva/webhook" value="/kumva/webhook">
    <small>Path to receive Africa's Talking callbacks. Set this in Africa's Talking settings.</small>
  </div>

  <div class="form-row">
    <label><i class="icon-info"></i> Full Webhook URL</label>
    <p style="padding:5px; background:#f0f0f0; border-radius:3px;">
      <code id="webhook-url-display">Will be generated based on .env KUMVA_WEBHOOK_BASE_URL</code>
    </p>
    <small>Copy this URL to Africa's Talking callback settings</small>
  </div>

  <div class="form-row">
    <label><i class="icon-info"></i> Environment Setup</label>
    <small>Add to your .env file:</small>
    <pre style="background:#f5f5f5; padding:10px; border-radius:3px; overflow-x:auto;">KUMVA_WEBHOOK_BASE_URL=https://your-domain.com</pre>
  </div>
</script>

<script type="text/html" data-help-name="kumva-webhook-config">
  <p><strong>Kumva Webhook Config Node</strong></p>
  <p>Configures the webhook receiver for Africa's Talking callbacks. Place this at the start of your flow.</p>
  
  <h3>Configuration</h3>
  <ul>
    <li><strong>Webhook Path:</strong> URL path where callbacks are received (e.g., /kumva/webhook)</li>
  </ul>

  <h3>Environment Setup</h3>
  <p>Set in your .env file:</p>
  <pre>KUMVA_WEBHOOK_BASE_URL=https://your-domain.com</pre>
  <p>The full webhook URL will be: <code>KUMVA_WEBHOOK_BASE_URL + webhookPath</code></p>

  <h3>Africa's Talking Setup</h3>
  <ol>
    <li>Copy the full webhook URL from this node</li>
    <li>Go to Africa's Talking dashboard</li>
    <li>For SMS: Settings → Webhooks → Callback URL (SMS)</li>
    <li>For Voice: Settings → Webhooks → Callback URL (Voice)</li>
    <li>Paste the webhook URL</li>
  </ol>

  <h3>Output</h3>
  <p>Passes through input message with added:</p>
  <ul>
    <li><code>msg.webhookUrl</code> - The full webhook URL</li>
  </ul>

  <h3>Notes</h3>
  <p>This node must be placed before StartCampaign in your flow to ensure webhook is configured before sessions are created.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType('kumva-webhook-config', {
    category: 'Kumva Insights',
    color: '#00BCD4',
    defaults: {
      name: { value: 'Webhook Config' },
      webhookPath: { value: '/kumva/webhook' }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-link',
    label: function() {
      return this.name || 'Webhook Config';
    },
    oneditprepare: function() {
      const baseUrl = process.env.KUMVA_WEBHOOK_BASE_URL || 'http://localhost:1880';
      const path = $('#node-input-webhookPath').val();
      const fullUrl = baseUrl.replace(/\/$/, '') + path;
      $('#webhook-url-display').text(fullUrl);

      $('#node-input-webhookPath').on('change', function() {
        const path = $(this).val();
        const fullUrl = baseUrl.replace(/\/$/, '') + path;
        $('#webhook-url-display').text(fullUrl);
      });
    }
  });
</script>
