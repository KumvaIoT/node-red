<script type="text/html" data-template-name="kumva-wait-for-response">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Wait For Response">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Response Timeout</label>
  </div>

  <div class="form-row">
    <label for="node-input-responseTimeout"><i class="icon-time"></i> Timeout Duration</label>
    <input type="text" id="node-input-responseTimeout" placeholder="30s" value="30s">
    <small>Format: 5s, 2m, 1h - Time to wait for user response</small>
  </div>

  <div class="form-row">
    <label for="node-input-handleTimeout"><i class="icon-warning"></i> On Timeout</label>
    <select id="node-input-handleTimeout" style="width:70%;">
      <option value="continue">Continue (null response)</option>
      <option value="retry">Retry with prompt</option>
      <option value="fallback">Use fallback output</option>
    </select>
  </div>

  <div class="form-row" id="max-retries-row" style="display:none;">
    <label for="node-input-maxRetries"><i class="icon-repeat"></i> Max Retries</label>
    <input type="number" id="node-input-maxRetries" placeholder="3" value="3" min="1">
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Response Validation</label>
  </div>

  <div class="form-row">
    <label for="node-input-validateResponse"><i class="fa fa-check-square"></i> Validate Response</label>
    <input type="checkbox" id="node-input-validateResponse">
  </div>

  <div class="form-row" id="validation-rules-row" style="display:none;">
    <label><i class="icon-info"></i> Validation Rules (JSON)</label>
    <textarea id="node-input-validationRules" placeholder='{"minLength": 1, "maxLength": 100, "pattern": "^[0-9]+$"}' style="width:100%; height:100px;"></textarea>
    <small>Supported: minLength, maxLength, pattern (regex), allowedValues (array), minValue, maxValue</small>
  </div>

  <div class="form-row" id="validation-fail-row" style="display:none;">
    <label for="node-input-onValidationFail"><i class="icon-warning"></i> On Validation Fail</label>
    <select id="node-input-onValidationFail" style="width:70%;">
      <option value="continue">Continue anyway</option>
      <option value="reject">Reject and retry</option>
    </select>
  </div>

  <hr>

  <div class="form-row">
    <label><i class="icon-info"></i> Storage & Logging</label>
  </div>

  <div class="form-row">
    <label for="node-input-storeResponses"><i class="fa fa-hdd-o"></i> Store Responses</label>
    <input type="checkbox" id="node-input-storeResponses" checked>
  </div>

  <div class="form-row">
    <label for="node-input-debugMode"><i class="fa fa-bug"></i> Debug Mode</label>
    <input type="checkbox" id="node-input-debugMode">
  </div>
</script>

<script type="text/html" data-help-name="kumva-wait-for-response">
  <p><strong>Kumva WaitForResponse Node</strong></p>
  <p>Waits for user input (SMS reply, DTMF tone input, voice response) with configurable timeout handling.</p>
  
  <h3>Configuration</h3>
  <ul>
    <li><strong>Timeout Duration:</strong> How long to wait for response (e.g., "30s", "2m")</li>
    <li><strong>On Timeout:</strong> Action when no response received:
      <ul>
        <li><em>Continue</em> - Pass message with null response</li>
        <li><em>Retry</em> - Send to retry output with counter</li>
        <li><em>Fallback</em> - Route to fallback output</li>
      </ul>
    </li>
    <li><strong>Validation Rules:</strong> Optional JSON rules to validate response content</li>
  </ul>

  <h3>Inputs</h3>
  <p>Message should contain (from SendMessage/Trigger):</p>
  <ul>
    <li><code>msg.sessionId</code> - Session identifier</li>
    <li><code>msg.phoneNumber</code> - User's phone number</li>
    <li><code>msg.campaignId</code> - Campaign identifier</li>
  </ul>

  <h3>Outputs</h3>
  <p>This node has 3 outputs:</p>
  <ul>
    <li><strong>Output 1 (Primary):</strong> Response received successfully
      <ul>
        <li><code>msg.response</code> - User's response content</li>
        <li><code>msg.responseType</code> - Type of response (text, dtmf, voice)</li>
        <li><code>msg.waitStatus</code> - 'response-received'</li>
      </ul>
    </li>
    <li><strong>Output 2 (Retry):</strong> Timeout with retry enabled OR validation failed
      <ul>
        <li><code>msg.retryCount</code> - Current retry attempt</li>
        <li><code>msg.maxRetries</code> - Maximum retry attempts</li>
        <li><code>msg.waitStatus</code> - 'timeout-retry' or 'validation-failed'</li>
      </ul>
    </li>
    <li><strong>Output 3 (Fallback):</strong> Timeout with fallback enabled
      <ul>
        <li><code>msg.waitStatus</code> - 'timeout-fallback'</li>
      </ul>
    </li>
  </ul>

  <h3>Response Validation</h3>
  <p>Optional JSON validation rules:</p>
  <ul>
    <li><code>minLength</code> - Minimum character length</li>
    <li><code>maxLength</code> - Maximum character length</li>
    <li><code>pattern</code> - Regex pattern to match</li>
    <li><code>allowedValues</code> - Array of acceptable values</li>
    <li><code>minValue</code> - Minimum numeric value</li>
    <li><code>maxValue</code> - Maximum numeric value</li>
  </ul>

  <h3>Examples</h3>
  <p><strong>DTMF Menu (1-3):</strong></p>
  <pre>{"minValue": 1, "maxValue": 3}</pre>

  <p><strong>Phone Number Validation:</strong></p>
  <pre>{"pattern": "^\\+?[0-9]{9,15}$"}</pre>

  <p><strong>Yes/No Response:</strong></p>
  <pre>{"allowedValues": ["yes", "no", "1", "2"]}</pre>
</script>

<script type="text/javascript">
  RED.nodes.registerType('kumva-wait-for-response', {
    category: 'Kumva Insights',
    color: '#9C27B0',
    defaults: {
      name: { value: 'Wait For Response' },
      responseTimeout: { value: '30s' },
      handleTimeout: { value: 'continue' },
      maxRetries: { value: 3, validate: RED.validators.number() },
      validateResponse: { value: false },
      validationRules: { value: '' },
      onValidationFail: { value: 'continue' },
      storeResponses: { value: true },
      debugMode: { value: false }
    },
    inputs: 1,
    outputs: 3,
    outputLabels: ['Response', 'Retry', 'Fallback'],
    icon: 'font-awesome/fa-hourglass-end',
    label: function() {
      return this.name || 'Wait For Response';
    },
    oneditprepare: function() {
      const handleTimeoutSelect = $('#node-input-handleTimeout');
      const validateCheckbox = $('#node-input-validateResponse');

      function updateDisplay() {
        const handleTimeout = handleTimeoutSelect.val();
        const validate = validateCheckbox.is(':checked');

        // Show max retries only for retry timeout
        if (handleTimeout === 'retry') {
          $('#max-retries-row').show();
        } else {
          $('#max-retries-row').hide();
        }

        // Show validation rules only if validation enabled
        if (validate) {
          $('#validation-rules-row').show();
          $('#validation-fail-row').show();
        } else {
          $('#validation-rules-row').hide();
          $('#validation-fail-row').hide();
        }
      }

      handleTimeoutSelect.on('change', updateDisplay);
      validateCheckbox.on('change', updateDisplay);
      updateDisplay();

      // Parse existing validation rules if string
      if (typeof this.validationRules === 'string' && this.validationRules) {
        try {
          const parsed = JSON.parse(this.validationRules);
          $('#node-input-validationRules').val(JSON.stringify(parsed, null, 2));
        } catch (e) {
          // Keep as is if invalid
        }
      }
    },
    oneditsave: function() {
      // Try to parse and validate JSON rules
      const rulesText = $('#node-input-validationRules').val();
      if (rulesText && this.validateResponse) {
        try {
          const rules = JSON.parse(rulesText);
          this.validationRules = JSON.stringify(rules);
        } catch (e) {
          RED.notify('Invalid JSON in validation rules', 'error');
        }
      }
    }
  });
</script>
